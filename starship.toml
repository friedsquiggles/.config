"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

format = """
$os$sudo$directory\
$all\
$character
"""

palette = 'custom'

[palettes.custom]
mauve = '#c6a0f6'

[character]
disabled = false
success_symbol = '[    󰅂 ](bold green)'
error_symbol = '[    󰅂 ](bold red)'

[cmd_duration]
disabled = true

[directory]
disabled = false
truncation_length = 8
truncation_symbol = ''
style = 'bold underline mauve'
read_only = " 󰌾"

[docker_context]
disabled = false
format = '[󰡨 $context ](blue bold)'

[fill]
disabled = true
symbol = ' '

[git_branch]
disabled = false
symbol = ''
format = '[$symbol$branch(:$remote_branch)]($style) '

[git_commit]
disabled = false
commit_hash_length = 6
tag_symbol = '🔖 '

[git_state]
disabled = false
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = '[🍒 PICKING](bold red)'

[git_status]
untracked = '[](bold yellow) '
staged = '[](bold green) '
stashed = "[](cyan) "
deleted = '[](bold red) '
modified= '[](bold blue) '
behind = '[](bold purple) '
ahead = '[](bold purple) '
format = '([$all_status$ahead_behind]($style))'

[aws]
symbol = "  "

[buf]
symbol = " "

[c]
symbol = " "

[golang]
symbol = " "

[guix_shell]
symbol = " "

[hg_branch]
symbol = " "

[hostname]
ssh_symbol = " "

[lua]
detect_folders = []
symbol = " "

[memory_usage]
symbol = "󰍛 "

[nix_shell]
symbol = " "

[nodejs]
version_format = "v${major}"
symbol = " "
detect_files = ['package.json', '.node-version', '!deno.json', '!bunfig.toml', '!bun.lockb']

[os]
disabled = false

[os.symbols]
Alpaquita = " "
Alpine = " "
